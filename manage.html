<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>問題管理</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; }
    h1 { color: #ff69b4; }
    .question {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px auto;
      width: 400px;
      border-radius: 10px;
    }
    img { max-width: 150px; display: block; margin: 10px auto; }
    button {
      margin: 5px; padding: 5px 15px;
      border: none; border-radius: 6px;
      background: #87cefa; color: white; cursor: pointer;
    }
    button:hover { background: #4682b4; }
    textarea {
      width: 90%;
      height: 60px;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>問題管理</h1>
  <button onclick="goHome()">ホームに戻る</button>
  <div id="questionList"></div>

  <script>
    // --- 問題一覧を表示 ---
    function loadQuestions() {
      const list = document.getElementById("questionList");
      list.innerHTML = "";

      const currentUser = localStorage.getItem("currentUser") || "guest";
      const key = "userQuestions_" + currentUser;
      let userQuestions = JSON.parse(localStorage.getItem(key) || "[]");

      if (userQuestions.length === 0) {
        list.innerHTML = "<p>まだオリジナル問題がありません。</p>";
        return;
      }

      // 補足情報も読み込み
      const notesKey = "extraNotes_" + currentUser;
      const notes = JSON.parse(localStorage.getItem(notesKey) || "{}");

      // ジャンルごとにグループ化
      const grouped = {};
      userQuestions.forEach((q, index) => {
        if (!grouped[q.genre]) grouped[q.genre] = [];
        grouped[q.genre].push({...q, index});
      });

      for (const genre in grouped) {
        const h2 = document.createElement("h2");
        h2.textContent = "ジャンル: " + genre;
        list.appendChild(h2);

        grouped[genre].forEach(q => {
          const div = document.createElement("div");
          div.className = "question";
          const noteKey = q.file; // quiz.html と同じルールでキーにする
          const note = notes[noteKey] || "";

          div.innerHTML = `
            <img src="${q.file}" alt="画像">
            <p><b>答え:</b> ${q.answer.join(", ")}</p>
            <textarea id="note_${q.index}" placeholder="補足情報">${note}</textarea><br>
            <button onclick="saveNote(${q.index})">補足を保存</button>
            <button onclick="editQuestion(${q.index})">答えを編集</button>
            <button onclick="deleteQuestion(${q.index})">削除</button>
          `;
          list.appendChild(div);
        });
      }
    }

    // --- 問題削除 ---
    function deleteQuestion(index) {
      if (!confirm("この問題を削除しますか？")) return;
      const currentUser = localStorage.getItem("currentUser") || "guest";
      const key = "userQuestions_" + currentUser;
      let userQuestions = JSON.parse(localStorage.getItem(key) || "[]");
      userQuestions.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(userQuestions));
      loadQuestions();
    }

    // --- 答えを編集 ---
    function editQuestion(index) {
      const currentUser = localStorage.getItem("currentUser") || "guest";
      const key = "userQuestions_" + currentUser;
      let userQuestions = JSON.parse(localStorage.getItem(key) || "[]");
      const newAnswer = prompt("新しい答えを入力（カンマ区切り可）", userQuestions[index].answer.join(","));
      if (newAnswer !== null) {
        userQuestions[index].answer = newAnswer.split(",").map(a => a.trim());
        localStorage.setItem(key, JSON.stringify(userQuestions));
        loadQuestions();
      }
    }

    // --- 補足情報を保存 ---
    function saveNote(index) {
      const currentUser = localStorage.getItem("currentUser") || "guest";
      const notesKey = "extraNotes_" + currentUser;
      let notes = JSON.parse(localStorage.getItem(notesKey) || "{}");

      const key = "userQuestions_" + currentUser;
      let userQuestions = JSON.parse(localStorage.getItem(key) || "[]");
      const question = userQuestions[index];

      const textarea = document.getElementById("note_" + index);
      notes[question.file] = textarea.value.trim();

      localStorage.setItem(notesKey, JSON.stringify(notes));
      alert("補足情報を保存しました！");
    }

    function goHome() {
      location.href = "index.html";
    }

    loadQuestions();
  </script>
</body>
</html>
