<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ビジュアルクイズ ホーム</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #fefefe;
      padding: 50px;
    }
    h1 {
      color: #ff69b4;
      margin-bottom: 10px;
    }
    #welcome {
      margin-bottom: 30px;
      font-size: 18px;
      color: #333;
    }
    button, select {
      display: block;
      margin: 20px auto;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #87cefa;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #4682b4;
    }
    select {
      background: #fff;
      color: #333;
      border: 2px solid #87cefa;
      width: 220px;
    }
  </style>
</head>
<body>
  <h1>ビジュアルクイズ</h1>
  <p id="welcome"></p>

  <!-- ジャンル選択 -->
  <label for="genre">ジャンルを選んでスタート:</label>
  <select id="genre">
    <option value="" disabled selected>ジャンルを選択</option>
    <option value="painting">絵画</option>
    <option value="history">歴史</option>
    <option value="geography">地理</option>
    <option value="anime">アニメ</option>
    <option value="random">ランダム</option>
  </select>

  <!-- クイズ開始ボタン -->
  <button onclick="startQuiz()">クイズをプレイ</button>

  <!-- 今日のプレイ記録ボタン -->
  <button onclick="showTodayStats()">今日プレイした問題数</button>

  <!-- 累計記録ボタン -->
  <button onclick="showTotalStats()">プレイした累計問題数</button>

  <!-- 管理画面ボタン -->
  <button onclick="location.href='manage.html'">管理画面へ</button>

  <h2>オリジナル問題を追加</h2>
  <!-- ドロップゾーン -->
  <div id="dropZone"
       style="width:300px;height:200px;border:2px dashed #87cefa;
              border-radius:10px;line-height:200px;
              margin:20px auto;cursor:pointer;">
    ここに画像をドラッグ&ドロップ
  </div>
  <!-- プレビュー表示 -->
  <img id="preview" style="max-width:200px;display:none;margin:10px auto;">
  <input type="file" id="userImage" accept="image/*"><br>
  <input type="text" id="userAnswerInput" placeholder="答えを入力"><br>
  <label for="userGenre">ジャンル:</label>
  <select id="userGenre">
    <option value="painting">絵画</option>
    <option value="history">歴史</option>
    <option value="geography">地理</option>
    <option value="anime">アニメ</option>
    <option value="user">オリジナル</option>
  </select><br>
  <button onclick="saveUserQuestion()">保存する</button>

  <script>
    // --- ログインチェック ---
    const currentUser = localStorage.getItem("currentUser");
    if (!currentUser) {
      alert("先にユーザー登録／ログインしてください！");
      location.href = "register.html";
    }
    document.getElementById("welcome").textContent = "ログイン中: " + currentUser;

    // --- クイズ開始 ---
    function startQuiz() {
      const genre = document.getElementById("genre").value;
      if (!genre) {
        alert("ジャンルを選んでください！");
        return;
      }
      localStorage.setItem("selectedGenre", genre);
      location.href = "quiz.html";
    }

    // --- 今日のプレイ数 ---
    function showTodayStats() {
      const today = new Date().toLocaleDateString();
      const count = localStorage.getItem("quizCount_" + currentUser + "_" + today) || 0;
      alert("今日プレイした問題数: " + count + "問");
    }

    // --- 累計プレイ数 ---
    function showTotalStats() {
      const total = localStorage.getItem("quizTotal_" + currentUser) || 0;
      alert("累計プレイした問題数: " + total + "問");
    }

    // --- ドラッグ&ドロップ処理 ---
    let droppedFile = null;
    const dropZone = document.getElementById("dropZone");
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.style.background = "#e0f7ff";
    });
    dropZone.addEventListener("dragleave", () => {
      dropZone.style.background = "";
    });
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.style.background = "";

      droppedFile = e.dataTransfer.files[0];
      if (droppedFile && droppedFile.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const preview = document.getElementById("preview");
          preview.src = evt.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(droppedFile);
      } else {
        alert("画像ファイルをドロップしてください！");
      }
    });

    // --- 保存処理（両対応） ---
    function saveUserQuestion() {
      const fileInput = document.getElementById("userImage");
      const answerInput = document.getElementById("userAnswerInput");
      const genreInput = document.getElementById("userGenre");

      const file = droppedFile || fileInput.files[0];
      if (!file || !answerInput.value.trim()) {
        alert("画像と答えを両方入力してください！");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const key = "userQuestions_" + currentUser;  // ユーザーごとのキー
        let userQuestions = JSON.parse(localStorage.getItem(key) || "[]");
        userQuestions.push({
          file: e.target.result,
          answer: [answerInput.value.trim()],
          genre: genreInput.value
        });
        localStorage.setItem(key, JSON.stringify(userQuestions));
        alert("保存しました！（ジャンル: " + genreInput.value + "）");

        // リセット
        droppedFile = null;
        fileInput.value = "";
        document.getElementById("preview").style.display = "none";
        answerInput.value = "";
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
