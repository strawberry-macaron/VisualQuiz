<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>クイズ</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; }
    img { max-width: 400px; margin: 20px; border: 3px solid #ddd; border-radius: 10px; }
    input, textarea { padding: 10px; font-size: 16px; }
    button {
      margin: 10px; padding: 10px 20px; font-size: 18px;
      border: none; border-radius: 8px;
      background: #87cefa; color: white; cursor: pointer;
    }
    button:hover { background: #4682b4; }
    #answerArea { margin-top: 20px; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>クイズ</h1>
  <div id="quiz-area">
    <img id="quiz-image" src="" alt="クイズ画像">
  </div>

  <!-- ユーザー入力 -->
  <input type="text" id="userAnswer" placeholder="答えを入力">
  <button onclick="showAnswer()">答えを見る</button>

  <!-- 答え表示 -->
  <div id="answerArea"></div>

  <!-- 補足情報入力欄 -->
  <div id="extraArea" style="margin-top:20px;">
    <textarea id="extraNote" 
              placeholder="ここに補足情報（例：作者、解説など）を書けます" 
              style="width:80%;height:80px;font-size:16px;padding:8px;"></textarea><br>
    <button onclick="saveNote()">メモを保存</button>
  </div>

  <!-- 自己採点ボタン -->
  <button onclick="markAnswer(true)" disabled>正解！</button>
  <button onclick="markAnswer(false)" disabled>不正解…</button>

  <!-- 画面の操作ボタン -->
  <div style="margin-top:20px;">
    <button onclick="goHome()">ホームに戻る</button>
  </div>

  <script>
    let questions = [];
    let currentQuestion;
    const today = new Date().toLocaleDateString();

    // --- 問題読み込み ---
    async function loadQuestions() {
      const genre = localStorage.getItem("selectedGenre") || "random";
      let pool = [];

      // 公式問題
      if (genre === "random") {
        const genres = ["painting", "history", "geography", "anime"];
        for (let g of genres) {
          try {
            const res = await fetch(`data/${g}.json`);
            const data = await res.json();
            pool = pool.concat(data);
          } catch (e) {
            console.warn(`${g}.json を読み込めませんでした`, e);
          }
        }
      } else {
        try {
          const res = await fetch(`data/${genre}.json`);
          const data = await res.json();
          pool = pool.concat(data);
        } catch (e) {
          console.warn(`${genre}.json を読み込めませんでした`, e);
        }
      }

      // ユーザーオリジナル問題
      const currentUser = localStorage.getItem("currentUser");
      if (currentUser) {
        const key = "userQuestions_" + currentUser;
        const userQuestions = JSON.parse(localStorage.getItem(key) || "[]");

        if (genre === "random") {
          pool = pool.concat(userQuestions);
        } else {
          pool = pool.concat(userQuestions.filter(q => q.genre === genre));
        }
      }

      if (pool.length === 0) {
        alert("このジャンルには問題がありません！");
        goHome();
        return;
      }

      questions = pool;
      loadQuestion();
    }

    // --- 問題を1問ランダムに出す ---
    function loadQuestion() {
      currentQuestion = questions[Math.floor(Math.random() * questions.length)];

      // DataURL（オリジナル問題）とファイル名（公式問題）を区別
      if (currentQuestion.file.startsWith("data:")) {
        document.getElementById("quiz-image").src = currentQuestion.file;
      } else {
        document.getElementById("quiz-image").src = "images/" + currentQuestion.file;
      }

      document.getElementById("userAnswer").value = "";
      document.getElementById("answerArea").textContent = "";
      document.getElementById("extraNote").value = "";
      document.querySelectorAll("button[onclick^='markAnswer']").forEach(btn => btn.disabled = true);
    }

    // --- 答えを表示 ---
    function showAnswer() {
      const userAns = document.getElementById("userAnswer").value.trim();
      const correctAns = Array.isArray(currentQuestion.answer)
        ? currentQuestion.answer.join(", ")
        : currentQuestion.answer;

      document.getElementById("answerArea").textContent =
        "正解: " + correctAns + " ／ あなたの答え: " + userAns;

      document.querySelectorAll("button[onclick^='markAnswer']").forEach(btn => btn.disabled = false);

      // 保存されている補足情報を読み込む（ユーザー × 問題ごと）
      const currentUser = localStorage.getItem("currentUser") || "guest";
      const notesKey = "extraNotes_" + currentUser;
      const notes = JSON.parse(localStorage.getItem(notesKey) || "{}");
      document.getElementById("extraNote").value = notes[currentQuestion.file] || "";
    }

    // --- 自己採点 ---
    function markAnswer(isCorrect) {
      let total = parseInt(localStorage.getItem("quizTotal") || "0");
      total++;
      localStorage.setItem("quizTotal", total);

      let todayCount = parseInt(localStorage.getItem("quizCount_" + today) || "0");
      todayCount++;
      localStorage.setItem("quizCount_" + today, todayCount);

      if (isCorrect) {
        alert("正解にしました！");
      } else {
        alert("不正解にしました！");
      }

      loadQuestion();
    }

    // --- 補足情報の保存（ユーザー × 問題ごと） ---
    function saveNote() {
      const note = document.getElementById("extraNote").value.trim();
      const currentUser = localStorage.getItem("currentUser") || "guest";
      const notesKey = "extraNotes_" + currentUser;

      let notes = JSON.parse(localStorage.getItem(notesKey) || "{}");
      notes[currentQuestion.file] = note; // 問題ごとに保存
      localStorage.setItem(notesKey, JSON.stringify(notes));
      alert("補足情報を保存しました！");
    }

    // --- ホームに戻る ---
    function goHome() {
      window.location.href = "index.html";
    }

    // ページを開いたら読み込み
    loadQuestions();
  </script>
</body>
</html>
